definition_version: 2
# Streamlit in Snowflake, container runtime (ADR-0020).
#
# The database is templated from the environment, never written here, so the
# same manifest deploys into any clone (NFR-6). `just deploy-app` exports
# WOA_DATABASE from the resolved target before calling `snow streamlit deploy`.
#
# The container runtime REQUIRES a pyproject.toml ("Installing dependencies
# failed because the pyproject.toml file does not exist"), and this trial
# account cannot have an external access integration ("External access is not
# supported for trial accounts"). So pyproject.toml is deployed with an EMPTY
# dependency list: the runtime gets its file, and there is nothing to fetch.
entities:
  woa_command_center:
    type: streamlit
    identifier:
      name: WOA_COMMAND_CENTER
      database: <% ctx.env.WOA_DATABASE %>
      schema: APP
    title: "Wind Ops AI — Command Center"
    query_warehouse: WOA_APP_WH
    runtime_name: SYSTEM$ST_CONTAINER_RUNTIME_PY3_11
    compute_pool: SYSTEM_COMPUTE_POOL_CPU
    main_file: streamlit_app.py
    artifacts:
      - streamlit_app.py
      - pyproject.toml
